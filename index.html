<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HemoAyuda</title>
<style>
:root{--bg:#fff;--c:#fff;--t:#1a2233;--m:#6b7588;--b:#dfe4ee;--p:#2563eb;--pl:#e6eeff;--r:#e11d48;--rl:#ffe8ed;--a:#d97706;--al:#fff3dc;--g:#16a34a;--gl:#e4f6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--c:#1a2130;--t:#e8ecf5;--m:#98a2b8;--b:#2b3448;--pl:#1d2c52;--rl:#3a1a26;--al:#3a2e14;--gl:#153222}}
:root[data-theme="dark"]{--bg:#0f1420;--c:#1a2130;--t:#e8ecf5;--m:#98a2b8;--b:#2b3448;--pl:#1d2c52;--rl:#3a1a26;--al:#3a2e14;--gl:#153222}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:430px;margin:0 auto;padding:12px 16px 96px}
button,input,select,textarea{font:inherit;color:inherit}
h3{font-size:16px;margin:18px 0 8px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
small{color:var(--m)}
.top{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 0 12px;font-size:16px}
.bk{position:absolute;left:0;background:none;border:0;font-size:28px;line-height:1;cursor:pointer;padding:0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;padding:6px 0 10px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;margin-top:16px}
.btn.red{background:var(--r)}.btn.o{background:none;border:1.5px solid var(--p);color:var(--p)}
.btn.link{background:none;color:var(--m);font-weight:400;margin-top:4px;padding:8px}
input:not([type=range]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c)}
input[type=range]{width:100%;accent-color:var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{flex:1;min-width:70px;padding:10px 8px;border:1px solid var(--b);border-radius:10px;background:var(--c);cursor:pointer}
.ch.on{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp{display:flex;align-items:center;gap:8px;padding:14px 10px;border:1px solid var(--b);border-radius:12px;background:var(--c);cursor:pointer;text-align:left}
.tp.on{border-color:var(--p);background:var(--pl);font-weight:600}
.rd{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin:0 0 6px;border:1px solid var(--b);border-radius:10px;background:var(--c);cursor:pointer;text-align:left}
.rd i{width:18px;height:18px;border:2px solid var(--m);border-radius:50%;flex:none}
.rd.cb i{border-radius:5px}
.rd.on{border-color:var(--p);background:var(--pl)}.rd.on i{background:var(--p);border-color:var(--p);box-shadow:inset 0 0 0 3px var(--pl)}
.rl{display:flex;justify-content:space-between}.rl b{color:var(--p)}
.dots{display:flex;gap:6px;margin:0 8px 6px}.dots i{flex:1;height:4px;border-radius:3px;background:var(--b)}.dots i.on{background:var(--p)}
.ep{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.ep:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:18px}
.ep>div:nth-child(2){flex:1}
.bd{font-size:12px;padding:3px 9px;border-radius:9px;font-weight:600;white-space:nowrap}
.s0{background:var(--rl);color:var(--r)}.s1{background:var(--al);color:var(--a)}.s2{background:var(--gl);color:var(--g)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--b)}.kv:last-child{border:0}.kv span:first-child{color:var(--m)}.kv span:last-child{text-align:right}
.cm{padding:11px;border-radius:10px;margin-bottom:6px;border:1px solid var(--b);background:var(--c);width:100%;text-align:left;cursor:pointer}
.cm.on{outline:2px solid var(--p)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:430px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:9px 0;font-size:12px;color:var(--m);cursor:pointer}
nav button.on{color:var(--p);font-weight:600}nav span{display:block;font-size:20px}
.bar{height:8px;border-radius:4px;background:var(--p);margin-top:4px}
.note{font-size:12.5px;color:var(--m);margin-top:8px}
.sw{display:flex;align-items:center;justify-content:space-between}
.tg{width:46px;height:26px;border-radius:13px;border:0;background:var(--b);position:relative;cursor:pointer;padding:0;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--p)}.tg.on i{transform:translateX(20px)}
.tg:focus-visible{outline:2px solid var(--p);outline-offset:2px}
nav div{align-items:center}
nav button.fab{flex:none;width:58px;height:58px;margin:-6px 8px;border-radius:50%;background:var(--r);padding:0;display:grid;place-items:center;transform:translateY(-18px);box-shadow:0 0 0 5px var(--c),0 6px 14px rgba(225,29,72,.35)}
nav button.fab:active{transform:translateY(-16px)}
.acts{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--b);background:var(--c);color:var(--p);display:grid;place-items:center;cursor:pointer;padding:0}
.ib.d{color:var(--r)}.ib.cf{background:var(--r);color:#fff;border-color:var(--r)}
.hero{background:rgb(254,254,255);border:1px solid var(--b);border-radius:18px;padding:6px;margin:6px 0 12px}.hero img{display:block;width:100%;height:auto;border-radius:12px}
.card{background:none;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:14px 0;margin:0}
.grid .card{border-bottom:0;padding:8px 0}
.hero{border:0;border-radius:0;padding:0;margin:0 0 8px}
.hero img{border-radius:0}
.lk{display:block;padding:12px 0;border-bottom:1px solid var(--b);color:var(--p);text-decoration:none}.lk small{color:var(--m)}
.kp{display:flex;gap:8px;text-align:center;border-bottom:1px solid var(--b);padding-bottom:12px}.kp>div{flex:1}.kp b{display:block;font-size:17px}.kp small{font-size:12px}
#app{position:relative}.lang{position:absolute;top:12px;right:16px;display:flex;gap:8px;z-index:5}.fl{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;overflow:hidden;opacity:.5;cursor:pointer;background:none}.fl.on{opacity:1;border-color:var(--p)}.fl svg,.fl i{display:block;width:100%;height:100%}
.fbar{display:flex;gap:6px;margin:2px 0 14px;overflow-x:auto;padding-bottom:2px}
.flt{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--b);background:var(--c);color:var(--m);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.flt.on{border-color:var(--t);background:var(--t);color:var(--bg)}
.fd{width:7px;height:7px;border-radius:50%;flex:none}
.hero{margin:4px 0 6px}
.hero .lg{width:150px;max-width:55%;margin:0 auto;display:block}
</style></head><body><div id="app"></div>

${kv('Dolor ahora',d.cmp||d.pain2!=5?d.pain2+'/10':'')}${kv('Respuesta',d.cmp)}${kv('Controlado',d.ctrl)}${kv('Atención médica',d.contact=='Sí'?(d.who.join(', ')||'Sí'):d.contact)}${kv('Indicaciones',d.ind)}${kv('Urgencias',d.urg)}${kv('Hospitalización',d.hosp)}${d.status=='Resuelto'?kv('Resuelto',d.resDate.split('-').reverse().join('/')+' · '+d.resTime):''}</div>`
+(saved?`<div class="label">${ST.map((x,i)=>`<button class="rd${d.status==x?' on':''}" data-a="stat" data-v="${x}"><i></i>${SI[i]} ${x}</button>`).join('')}</div><div class="acts">${S.del?'<small>Pulsa de nuevo para eliminar</small>':''}<button class="ib" data-a="edit" aria-label="Editar información"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button><button class="ib d${S.del?' cf':''}" data-a="del" aria-label="Eliminar episodio"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button></div>`:`<button class="btn" data-a="save">Guardar sangrado</button><button class="btn o" data-a="editd">Editar información</button>`)}

function quick(){const d=S.d;return hd('Registrar sangrado',1)+`<div class="card"><b>🩸 Modo rápido</b><br><small>Registra la información básica ahora y completa el resto más tarde.</small></div><h3>¿Dónde se produce?</h3><div class="grid">${TYPES.map(t=>`<button class="tp${d.type==t[0]?' on':''}" data-a="set" data-k="type" data-v="${t[0]}"><span>${t[1]}</span>${t[0]}</button>`).join('')}</div><h3>${'&nbsp;'}</h3>${rng('pain','Dolor actual')}<h3>¿Por qué ocurrió?</h3><div class="chs">${[['Espontáneo','Espontáneo'],['Después de un golpe','Golpe'],['Después de ejercicio/actividad física','Actividad'],['Otro','Otro']].map(c=>chip('cause',c[0],d.cause,c[1])).join('')}</div><button class="btn red" data-a="saveq">Registrar ahora</button><button class="btn link" data-a="full">Prefiero el formulario completo</button>`}

const cnt=s=>E.filter(d=>d.status==s).length;
function home(){return `<div class="hero"><img class="lg" src="${LOGO}" alt="HemoAyuda. Tu bienestar, nuestro objetivo. Registra tus sangrados y mantén un mejor control de tu salud."></div>${E.length?`<div class="kp"><div><b>${cnt('Activo')}</b><small>Activos</small></div><div><b>${cnt('En evolución')}</b><small>En evolución</small></div><div><b>${fl(E[0]).split(' · ')[0]}</b><small>Último registro</small></div></div>`:''}<h3>Últimos episodios</h3><div class="card">${E.length?E.slice(0,5).map((d,i)=>epRow(d,i)).join(''):'<p><small>Aún no hay episodios. Pulsa el botón rojo + para registrar un sangrado.</small></p>'}</div><button class="btn link" data-a="priv">Privacidad</button>`}

function hist(){const L=E.map((d,i)=>[d,i]).filter(x=>S.flt=='Todos'||x[0].status==S.flt);return hd('Historial')+`<div class="fbar"><button class="flt${S.flt=='Todos'?' on':''}" data-a="set" data-k="flt" data-v="Todos">Todos</button><button class="flt${S.flt=='Activo'?' on':''}" data-a="set" data-k="flt" data-v="Activo"><i class="fd" style="background:#e11d48"></i>Activo</button><button class="flt${S.flt=='En evolución'?' on':''}" data-a="set" data-k="flt" data-v="En evolución"><i class="fd" style="background:#d97706"></i>En evolución</button><button class="flt${S.flt=='Resuelto'?' on':''}" data-a="set" data-k="flt" data-v="Resuelto"><i class="fd" style="background:#16a34a"></i>Resuelto</button></div>${L.length?L.map(x=>epRow(x[0],x[1])).join(''):'<p><small>No hay episodios con este filtro.</small></p>'}`}

function stats(){const t=Date.now()-30*864e5,r=E.filter(d=>new Date(d.date+'T00:00')>=t),c={};E.forEach(d=>{const k=d.loc||d.type;c[k]=(c[k]||0)+1});const mx=Math.max(1,...Object.values(c));
const p=E.length?(E.reduce((a,d)=>a+d.pain,0)/E.length).toFixed(1):'—';
return hd('Estadísticas')+`<div class="grid"><div class="card"><small>Total</small><h2 style="margin:4px 0">${E.length}</h2></div><div class="card"><small>Últimos 30 días</small><h2 style="margin:4px 0">${r.length}</h2></div><div class="card"><small>Con tratamiento</small><h2 style="margin:4px 0">${E.filter(d=>d.tx=='Sí').length}</h2></div><div class="card"><small>Dolor inicial medio</small><h2 style="margin:4px 0">${p}</h2></div></div><h3>Por localización</h3><div class="card">${Object.keys(c).length?Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="rl"><span>${esc(k)}</span><b>${v}</b></div><div class="bar" style="width:${v/mx*100}%"></div><div style="height:8px"></div>`).join(''):'<small>Sin datos todavía.</small>'}</div>`}

const dark=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches};
try{const t=localStorage.getItem('hmt');if(t)document.documentElement.dataset.theme=t}catch(e){}
function sett(){return hd('Ajustes')+`<div class="card sw"><span>Modo oscuro</span><button class="tg${dark()?' on':''}" role="switch" aria-checked="${dark()}" aria-label="Modo oscuro" data-a="theme"><i></i></button></div><div class="card"><b>Tus datos</b><p class="note">Los episodios se guardan solo en este navegador. Esta herramienta te ayuda a llevar un registro para tu equipo de hematología, pero no sustituye sus indicaciones.</p><button class="btn" data-a="exp">Exportar todos los registros (CSV)</button><p class="note">Se genera un archivo CSV. Para llevarlo a Google Drive, guárdalo cuando te lo ofrezca el navegador (o elige Drive en el menú de compartir del móvil) y súbelo desde drive.google.com si hace falta.</p><button class="btn link" data-a="clr">${S.del?'Pulsa otra vez para borrar todo':'Borrar todos los datos'}</button></div><div id="msg" class="note" role="status"></div>`}
async function exportCsv(){const m=document.getElementById('msg');if(!E.length){m.textContent=tt('Todavía no hay registros que exportar.');return}
const C=[['Fecha',d=>d.date],['Hora de inicio',d=>d.time],['Se dio cuenta',d=>d.noticed],['Tipo',d=>d.type],['Localización',d=>title(d)],['Detalle',d=>d.locx],['Origen',d=>d.cause],['Dolor inicial',d=>d.pain],['Síntomas',d=>d.sx.join('; ')],['Tratamiento',d=>d.tx],['Producto',d=>d.tx=='Sí'?d.prod:''],['Nombre comercial',d=>d.brand],['Dosis',d=>d.dose?d.dose+' '+d.unit:''],['Hora administración',d=>d.tx=='Sí'?d.txTime:''],['Dosis adicionales',d=>d.extra.map(x=>(x.dose||'?')+' '+d.unit+' a las '+(x.time||'?')).join('; ')],['Dolor posterior',d=>d.cmp||d.pain2!=5?d.pain2:''],['Comparado con el inicio',d=>d.cmp],['Controlado',d=>d.ctrl],['Contacto médico',d=>d.contact],['Con quién',d=>d.who.join('; ')],['Indicaciones',d=>d.ind],['Urgencias',d=>d.urg],['Hospitalización',d=>d.hosp],['Estado',d=>d.status],['Resolución',d=>d.status=='Resuelto'?d.resDate+' '+d.resTime:'']];
const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
const csv='\ufeff'+[C.map(c=>q(c[0])).join(','),...E.map(d=>C.map(c=>q(c[1](d))).join(','))].join('\r\n');
try{const dl=window.claude&&await window.claude.use('downloads');
if(dl){await dl.save({filename:'registro-sangrados-'+now().date+'.csv',data:csv});m.textContent=tt('Archivo guardado. Ya puedes subirlo a Google Drive.');return}}
catch(e){m.textContent=e&&e.code=='declined'?tt('Exportación cancelada.'):tt('No se pudo guardar el archivo.');return}
try{await navigator.clipboard.writeText(csv);m.textContent=tt('La descarga no está disponible aquí; el CSV se ha copiado al portapapeles para pegarlo en una hoja de Google.')}catch(e){m.textContent=tt('La exportación no está disponible en este navegador.')}}

function priv(){return hd('Privacidad',1)+`<h3>Tus datos son solo tuyos</h3><p>HemoAyuda no guarda ninguna información personal en servidores ni en la nube. No hay cuentas, registro de usuarios ni envío de datos.</p><p>Todo lo que registras (fechas, localización, tratamientos, dolor, notas) se guarda únicamente en local, en el almacenamiento de este navegador, en el teléfono del paciente. Nadie más puede verlo.</p><h3>Qué debes saber</h3><p>Si borras los datos del navegador, cambias de teléfono o usas otro dispositivo, los registros no se trasladan. Para conservar una copia, usa «Exportar todos los registros» en Ajustes.</p><p>Puedes eliminar todo lo guardado en cualquier momento desde Ajustes.</p><h3>Enlaces de interés</h3><a class="lk" href="https://fedhemo.com" target="_blank" rel="noopener noreferrer"><span><b>FEDHEMO</b><br><small>Federación Española de Hemofilia</small></span></a><a class="lk" href="https://wfh.org" target="_blank" rel="noopener noreferrer"><span><b>WFH</b><br><small>Federación Mundial de Hemofilia</small></span></a><a class="lk" href="https://liberatelife.es" target="_blank" rel="noopener noreferrer"><span><b>Liberate Life</b><br><small>Plataforma de Sobi para personas con hemofilia</small></span></a><p class="note">Los enlaces a otras webs (FEDHEMO, WFH, Liberate Life) se abren fuera de HemoAyuda y cada una tiene su propia política de privacidad.</p>`}
function R(){let h;
if(S.scr=='quick')h=quick();else if(S.scr=='wiz')h=wiz();else if(S.scr=='sumd')h=summary(S.d,0);else if(S.scr=='priv')h=priv();else if(S.scr=='view')h=summary(E[S.edit],1);
else h={home,hist,stats,sett}[S.tab]();
const nav=[['home','🏠','Inicio'],['hist','📋','Historial'],['stats','📊','Estadísticas'],['sett','⚙️','Ajustes']];
document.getElementById('app').innerHTML=langSw()+h+`<nav><div>${(()=>{const b=nav.map(n=>`<button class="${!S.scr&&S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`);b.splice(2,0,'<button class="fab" data-a="new" aria-label="Registrar sangrado"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>');return b.join('')})()}</div></nav>`;tr(document.getElementById('app'));document.documentElement.lang=LANG;window.scrollTo(0,0)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,k=el.dataset.k,v=el.dataset.v,d=S.d;
if(a!='del'&&a!='clr')S.del=false;
if(a=='tab'){S.tab=v;S.scr=null}
else if(a=='set'){if(k=='flt')S.flt=v;else{d[k]=v;if(k=='type'){d.loc='';d.side=''}}}
else if(a=='tog'){const i=d[k].indexOf(v);i<0?d[k].push(v):d[k].splice(i,1)}
else if(a=='new'){S.d=newD();S.edit=null;S.scr='quick'}
else if(a=='full'){S.step=0;S.scr='wiz'}
else if(a=='saveq'){S.d.status='Activo';E.unshift(S.d);save();S.scr=null;S.tab='home'}
else if(a=='next'){if(S.step<5)S.step++;else S.scr='sumd'}
else if(a=='back'){if(S.scr=='wiz'&&S.step>0)S.step--;else if(S.scr=='sumd'){S.scr='wiz';S.step=5}else S.scr=null}
else if(a=='addx'){d.extra.push({dose:'',time:now().time})}
else if(a=='save'){if(S.edit!=null)E[S.edit]=S.d;else E.unshift(S.d);save();S.scr=null;S.tab='hist'}
else if(a=='editd'){S.scr='wiz';S.step=0}
else if(a=='open'){S.edit=+el.dataset.i;S.scr='view'}
else if(a=='edit'){S.d=JSON.parse(JSON.stringify(E[S.edit]));S.step=0;S.scr='wiz'}
else if(a=='stat'){E[S.edit].status=v;save()}
else if(a=='del'){if(S.del){E.splice(S.edit,1);save();S.scr=null;S.del=false}else S.del=true}
else if(a=='clr'){if(S.del){E=[];save();S.del=false}else S.del=true}
else if(a=='theme'){const n=dark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('hmt',n)}catch(x){}}
else if(a=='priv'){S.scr='priv'}
else if(a=='lang'){LANG=v;try{localStorage.setItem('hml',v)}catch(x){}}
else if(a=='exp'){exportCsv();return}
R()});
document.addEventListener('input',e=>{const t=e.target,d=S.d;
if(t.dataset.x){const[i,f]=t.dataset.x.split('.');d.extra[i][f]=t.value;return}
const k=t.dataset.k;if(!k)return;
if(t.type=='range'){d[k]=+t.value;const o=document.getElementById('o_'+k);if(o)o.textContent=t.value+'/10';return}
d[k]=t.value;if(k=='type'){d.loc='';d.side='';R()}});
R();
</script></body></html>
