<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HemoAyuda</title><link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#800020"><meta name="apple-mobile-web-app-title" content="HemoAyuda"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff9f2;--gl1:255,249,242;--gl2:255,249,242;--c:#fff9f2;--t:#3a1420;--m:#8a6f6b;--b:#f3e6d5;--p:#800020;--pl:#f3e6d5;--r:#d45060;--rl:#fbe6e8;--a:#d97706;--al:#fff3dc;--g:#16a34a;--gl:#e4f6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{margin:0;width:100%;overflow-x:hidden}
body{background:radial-gradient(1100px 700px at 15% -10%,rgba(128,0,32,.08),transparent 60%),radial-gradient(900px 600px at 100% 0%,rgba(212,80,96,.10),transparent 55%),var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh}
#app{max-width:430px;width:100%;margin:0 auto;padding:12px 16px 104px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h3{font-size:16px;margin:18px 0 8px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
small{color:var(--m)}
.top{display:flex;align-items:center;justify-content:center;position:relative;padding:8px 0 12px;font-size:16px}
.bk{position:absolute;left:0;background:none;border:0;font-size:28px;line-height:1;cursor:pointer;padding:0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;padding:6px 0 10px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;margin-top:16px}
.btn.red{background:var(--r)}.btn.o{background:rgba(128,0,32,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid rgba(128,0,32,.28);color:var(--p)}
.btn.link{background:none;color:var(--m);font-weight:400;margin-top:4px;padding:8px}
input:not([type=range]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);font-size:16px}
input[type=range]{width:100%;accent-color:var(--p)}
.row{display:flex;gap:8px}.row>*{flex:1}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{flex:1;min-width:70px;padding:10px 6px;border:1px solid var(--b);border-radius:10px;background:var(--c);cursor:pointer;font-size:12.5px;text-align:center;white-space:normal;line-height:1.2;word-break:break-word}
.ch.on{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp{display:flex;align-items:center;gap:8px;padding:14px 10px;border:1px solid var(--b);border-radius:12px;background:var(--c);cursor:pointer;text-align:left}
.tp.on{border-color:var(--p);background:var(--pl);font-weight:600}
.rd{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin:0 0 6px;border:1px solid var(--b);border-radius:10px;background:var(--c);cursor:pointer;text-align:left}
.rd i{width:18px;height:18px;border:2px solid var(--m);border-radius:50%;flex:none}
.rd.cb i{border-radius:5px}
.rd.on{border-color:var(--p);background:var(--pl)}.rd.on i{background:var(--p);border-color:var(--p);box-shadow:inset 0 0 0 3px var(--pl)}
.rl{display:flex;justify-content:space-between}.rl b{color:var(--p)}
.dots{display:flex;gap:6px;margin:0 8px 6px}.dots i{flex:1;height:4px;border-radius:3px;background:var(--b)}.dots i.on{background:var(--p)}
.ep{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.ep:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:18px}
.ep>div:nth-child(2){flex:1}
.bd{font-size:12px;padding:3px 9px;border-radius:9px;font-weight:600;white-space:nowrap}
.s0{background:var(--rl);color:var(--r)}.s1{background:var(--al);color:var(--a)}.s2{background:var(--gl);color:var(--g)}
.bd{display:inline-flex;align-items:center;gap:5px;background:none!important;padding:0!important;font-weight:600;font-size:11.5px;letter-spacing:.2px;text-transform:uppercase}
.bd::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--b)}.kv:last-child{border:0}.kv span:first-child{color:var(--m)}.kv span:last-child{text-align:right}
.cm{padding:11px;border-radius:10px;margin-bottom:6px;border:1px solid var(--b);background:var(--c);width:100%;text-align:left;cursor:pointer}
.cm.on{outline:2px solid var(--p)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{position:relative;max-width:430px;width:100%;display:flex;background:rgba(var(--gl1),.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(var(--gl2),.08);border-radius:26px;box-shadow:0 10px 30px rgba(20,30,60,.18),inset 0 1px 0 rgba(255,255,255,.5);padding:4px}
nav button{position:relative;flex:1;background:none;border:0;padding:9px 0;border-radius:20px;font-size:12px;color:var(--m);cursor:pointer}
nav button.on{color:var(--p);font-weight:600}
nav button.on::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--p)}
nav button.fab.on::after{display:none}
nav span{display:block;font-size:20px}
.bart{height:10px;border-radius:6px;background:var(--b);overflow:hidden;margin:6px 0 12px}
.bart .bar{height:100%;border-radius:6px}
.note{font-size:12.5px;color:var(--m);margin-top:8px}
.sw{display:flex;align-items:center;justify-content:space-between}
.tg{width:46px;height:26px;border-radius:13px;border:0;background:var(--b);position:relative;cursor:pointer;padding:0;transition:background .2s}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tg.on{background:var(--p)}.tg.on i{transform:translateX(20px)}
.tg:focus-visible{outline:2px solid var(--p);outline-offset:2px}
nav div{align-items:center}
nav button.fab{flex:none;width:58px;height:58px;margin:-4px 8px;border-radius:50%;background:linear-gradient(155deg,#d45060,var(--p));padding:0;display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 0 0 5px rgba(var(--gl1),.55),0 10px 22px rgba(128,0,32,.35),inset 0 1px 1px rgba(255,255,255,.6)}
nav button.fab:active{transform:translateY(-16px)}
.acts{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--b);background:var(--c);color:var(--p);display:grid;place-items:center;cursor:pointer;padding:0}
.ib.d{color:var(--r)}.ib.cf{background:var(--r);color:#fff;border-color:var(--r)}
.hero{background:rgb(254,254,255);border:1px solid var(--b);border-radius:18px;padding:6px;margin:6px 0 12px}.hero img{display:block;width:100%;height:auto;border-radius:12px}
.card{background:none;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:14px 0;margin:0}
.grid .card{border-bottom:0;padding:8px 0}
.hero{border:0;border-radius:0;padding:0;margin:0 0 8px}
.hero img{border-radius:0}
.lk{display:block;padding:12px 0;border-bottom:1px solid var(--b);color:var(--p);text-decoration:none}.lk small{color:var(--m)}
.kp{display:flex;gap:8px;text-align:center;border-bottom:1px solid var(--b);padding-bottom:12px}.kp>div{flex:1}.kp b{display:block;font-size:17px}.kp small{font-size:12px}
#app{position:relative}.lang{position:absolute;top:12px;right:16px;display:flex;gap:8px;z-index:5}.fl{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;overflow:hidden;opacity:.5;cursor:pointer;background:none}.fl.on{opacity:1;border-color:var(--p)}.fl svg,.fl i{display:block;width:100%;height:100%}
.fbar{display:flex;gap:6px;margin:2px 0 14px;overflow-x:auto;padding-bottom:2px}
.flt{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--b);background:var(--c);color:var(--m);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.flt.on{border-color:var(--t);background:var(--t);color:var(--bg)}
.fd{width:7px;height:7px;border-radius:50%;flex:none}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.hdr .lg{height:32px;width:auto;display:block}
.hdr .lang{position:static;top:auto;right:auto}
.langsel{width:auto;min-width:160px}

.fcg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 20px}
.fc{aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(var(--gl2),.08);border-radius:18px;background:rgba(var(--gl1),.5);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);font-size:12.5px;font-weight:600;color:var(--t);cursor:pointer;padding:6px;box-shadow:0 8px 20px rgba(20,30,60,.10),inset 0 1px 0 rgba(255,255,255,.5)}
.fc span{font-size:22px}
.fc.fcr{border-color:rgba(212,80,96,.32);color:var(--r);background:rgba(212,80,96,.12)}
.topmenu{position:absolute;top:10px;right:14px;z-index:6}
.hb{width:38px;height:38px;border-radius:50%;border:1px solid rgba(var(--gl2),.08);background:rgba(var(--gl1),.55);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);color:var(--t);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 14px rgba(20,30,60,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.dd{position:absolute;top:46px;right:0;background:rgba(var(--gl1),.7);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(var(--gl2),.08);border-radius:16px;box-shadow:0 14px 30px rgba(20,30,60,.2),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden;min-width:160px}
.ddi{display:block;width:100%;text-align:left;padding:12px 14px;background:none;border:0;cursor:pointer;font-size:14px}
.ovl{position:fixed;inset:0;background:transparent;border:0;padding:0;z-index:5}
.sosb{color:var(--r)!important}
.sosHead{background:rgba(212,80,96,.12);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(212,80,96,.2);color:var(--r);border-radius:18px;padding:14px;margin:4px 0 14px}
.sosHead p{margin:6px 0 0;font-size:13px;color:var(--t)}
.seg{display:flex;gap:4px;background:rgba(var(--gl1),.5);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(var(--gl2),.08);border-radius:14px;padding:4px;margin:4px 0 16px}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--m);cursor:pointer}
.seg button.on{background:var(--c);color:var(--t);box-shadow:0 2px 8px rgba(20,30,60,.12)}
.locr{display:flex;align-items:center;gap:12px;padding:8px 0}
.locb{flex:1}
.loadwrap{min-height:70vh;min-height:70dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.loadwrap .lg{width:120px;height:auto}
.loadwrap p{color:var(--m);font-size:14px}
.spin{width:30px;height:30px;border:3px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navwrap{flex:1;display:flex}
.navwrap>button{flex:1}
.navdd{position:absolute;bottom:calc(100% + 10px);right:8px;background:var(--c);border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 20px rgba(20,30,60,.18);overflow:hidden;min-width:180px;z-index:7}
.navdd .ddi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--t)}
.navdd .ddi+.ddi{border-top:1px solid var(--b)}
.fabhint{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:700;color:var(--r);white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(255,255,255,.6)}
.fabhint b{font-weight:700;animation:hintPop .5s ease}
.fabhint .chevs{display:flex;flex-direction:column;align-items:center;margin-top:-2px;line-height:.55}
.fabhint .chevs i{font-style:normal;font-size:12px;animation:chevBounce 1.3s ease-in-out infinite}
.fabhint .chevs i:last-child{opacity:.55;animation-delay:.12s}
@keyframes chevBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes hintPop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
/* Medicación > Historial: estilo del dashboard de Hemlibra (tarjetas con borde, etiquetas en versalitas, cifras tabulares, monoespaciada para lotes) */
.mh{--s1:var(--p);--s2:#d97706;--sf:#fff;--ln:#eadccb;--ink2:#5e4a4c;--tint:#f8eee4;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:14px;font-variant-numeric:tabular-nums}
.mh h4{font-size:15px;margin:0;font-weight:600;color:var(--t)}
.mh .hint{color:var(--ink2);font-size:12.5px;margin:3px 0 0}
.mh-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mh-kpi{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 13px;min-width:0}
.mh-kpi.w{grid-column:1/-1}
.mh-kpi .l{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mh-kpi .v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;color:var(--t);line-height:1.15}
.mh-kpi .s{color:var(--ink2);font-size:12px;margin-top:2px}
.mh-card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mh-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px}
.mh-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.mh-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mh-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mh svg text{font-family:inherit;fill:var(--m);font-size:11px}
.mh svg text.val{fill:var(--t);font-weight:600;font-size:11.5px}
.mh svg .grid{stroke:var(--ln);stroke-width:1}
.mh svg .base{stroke:var(--m);stroke-width:1}
.mh svg rect.mbar{cursor:pointer}
.mh svg rect.sbar{cursor:pointer}
.mh svg rect.sbar.sel{stroke:var(--t);stroke-width:2}
.mh svg rect.mbar.sel{stroke:var(--t);stroke-width:2}
.mh-det{background:var(--t);color:var(--bg);border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.45}
.mh-det b{font-weight:600}
.mh-units{display:flex;gap:4px}
.mh-units button{border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.mh-units button.on{background:var(--t);border-color:var(--t);color:var(--bg)}
.mh-sites{display:flex;flex-direction:column;gap:11px}
.mh-site .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mh-site .row span:last-child{font-weight:600}
.mh-track{height:8px;background:var(--tint);border-radius:2px;margin-top:5px;overflow:hidden}
.mh-fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.mh-rot{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.mh-chip{font-size:11px;text-align:center;border-radius:4px;padding:4px 0 3px;border:1px solid var(--ink2);font-weight:600;line-height:1.2;color:var(--t)}
.mh-chip small{display:block;font-weight:400;color:inherit;opacity:.85;font-size:10px}
.mh-chip.ab{background:var(--t);color:var(--bg);border-color:var(--t)}
.mh-chip.br{background:var(--tint);border-color:var(--s2);color:var(--t)}
.mh-chip.in{background:var(--s2);border-color:var(--s2);color:#fff}
.mh-tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mh-tw.maxh{max-height:420px;overflow:auto}
.mh table{width:100%;border-collapse:collapse;font-size:12.5px}
.mh th{text-align:left;font-weight:600;color:var(--m);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;position:sticky;top:0;background:var(--sf)}
.mh td{padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;color:var(--t)}
.mh td.m{font-family:var(--mono);font-size:12px}
.mh tr[data-a]{cursor:pointer}
.mh tr[data-a]:active td{background:var(--tint)}
.mh .kind{display:inline-flex;align-items:center;gap:6px}
.mh .kind i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mh .dot{color:var(--s2);font-weight:700}
.mh .empty{color:var(--ink2);padding:18px 4px;text-align:center;white-space:normal}
.mh-flt{display:flex;flex-wrap:wrap;gap:8px}
.mh-flt label{display:flex;flex-direction:column;gap:3px;margin:0;font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.06em;flex:1;min-width:130px}
.mh-flt select{padding:7px 9px;font-size:14px;border-radius:6px;border:1px solid var(--ln);background:var(--sf);text-transform:none;letter-spacing:0}
.mh-note{background:var(--al);color:#7a4b00;border-radius:6px;padding:9px 11px;font-size:12.5px}
.mh-ft{text-align:left;cursor:pointer;font:inherit}
.mh-ft .l i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.mh-ft.on{border-color:var(--t);box-shadow:inset 0 0 0 1px var(--t)}
.mh-mon{display:flex;justify-content:space-between;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:12px 0 6px;border-bottom:1px solid var(--ln)}
.mh-mon:first-child{padding-top:0}
.mh-er{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px solid var(--ln);text-align:left;cursor:pointer;font:inherit;color:var(--t)}
.mh-er:active{background:var(--tint)}
.mh-dd{width:40px;flex:none;text-align:center;border:1px solid var(--ln);border-radius:6px;padding:4px 0;line-height:1.1}
.mh-dd b{display:block;font-size:17px}.mh-dd small{font-size:10.5px;text-transform:uppercase;color:var(--m)}
.mh-eb{flex:1;min-width:0}.mh-eb b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mh-eb small{color:var(--ink2);font-size:12px}
.mh-es{flex:none;font-size:11.5px;font-weight:600}
a.btn{text-decoration:none}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto;flex:none}
.i.warn{stroke:#f5b301;width:20px;height:20px;display:inline-block;margin:0 8px 0 0;vertical-align:-4px}
.ic .i{width:20px;height:20px}
.mh-btn{background:var(--s1);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13.5px}

async function loadUserData(){
  const[epR,medR,sosR]=await Promise.all([
    sb.from('episodes').select('data').order('created_at',{ascending:false}),
    sb.from('medications').select('data').order('created_at',{ascending:false}),
    sb.from('sos_profile').select('data').eq('user_id',UID).maybeSingle()
  ]);
  if(epR.error||medR.error||sosR.error)throw(epR.error||medR.error||sosR.error);
  if(epR.data&&epR.data.length){E=epR.data.map(r=>r.data);save();}
  else if(E.length){for(const d of E)await sb.from('episodes').upsert({id:d.id,status:d.status,date:d.date,data:d});}
  if(medR.data&&medR.data.length){M=medR.data.map(r=>r.data);saveM();}
  else if(M.length){for(const d of M)await sb.from('medications').upsert({id:d.id,kind:d.kind,date:d.date,data:d});}
  if(sosR.data&&sosR.data.data){P=sosR.data.data;try{localStorage.setItem('hmp',JSON.stringify(P))}catch(e){}}

}

function authErrMsg(e){const m=(e&&e.message)||'';

  if(/Password should be at least/i.test(m))return tt('La contraseña debe tener al menos 6 caracteres.');
  return tt('Ha ocurrido un error. Inténtalo de nuevo.');
}
async function authSubmit(){
  if(!AUTH_ENABLED)return;
  if(!sb){AUTH_FATAL=true;R();return;}
  const u=AU.user.trim();
  if(u.length<3){AUTH_ERR=tt('El usuario debe tener al menos 3 caracteres.');R();return;}
  if(AU.pass.length<6){AUTH_ERR=tt('La contraseña debe tener al menos 6 caracteres.');R();return;}
  if(AU.mode=='register'&&AU.pass!==AU.pass2){AUTH_ERR=tt('Las contraseñas no coinciden.');R();return;}
  AUTH_BUSY=true;AUTH_ERR='';R();
  const email=emailFor(u);
  try{
    let res;
    if(AU.mode=='register'){
      res=await sb.auth.signUp({email,password:AU.pass,options:{data:{username:u}}});
      if(res.error)throw res.error;
      if(!res.data.session){res=await sb.auth.signInWithPassword({email,password:AU.pass});if(res.error)throw res.error;}
    }else{
      res=await sb.auth.signInWithPassword({email,password:AU.pass});
      if(res.error)throw res.error;
    }
    UID=res.data.session.user.id;
    CURRENT_USER=u;
    AU.pass='';AU.pass2='';
    await enterApp();
  }catch(e){console.error('auth error',e);AUTH_BUSY=false;AUTH_ERR=authErrMsg(e);}
  R();
}

async function downloadCsv(filename,csv,m){

return `<div><h4>${tt('Puntos de administración')}</h4><p class="hint">${tt('Número de veces por zona.')}</p></div>
<div class="mh-sites">${Object.entries(c).map(([k,v])=>`<div class="mh-site"><div class="row"><span>${k}</span><span>${v}</span></div><div class="mh-track"><div class="mh-fill" style="width:${v/mx*100}%"></div></div></div>`).join('')}</div>
${A.length?`<div><h4 style="font-size:13px;margin-bottom:8px">${tt('Rotación en orden de fecha')}</h4><div class="mh-rot">${R2.map(x=>{const d=x[0],st=medSite(d),c=d.kind=='Infusión'?'in':(st=='Abdomen'?'ab':(st.startsWith('Brazo')?'br':''));return `<div class="mh-chip ${c}" title="${esc(fl(d))} · ${esc(st)}">${mhAb(st)}<small>${mhD(d)}</small></div>`}).join('')}</div><p class="hint" style="margin-top:8px">AB: ${tt('abdomen')}. MI/MD: ${tt('muslo izquierdo/derecho')}. BI/BD: ${tt('brazo izquierdo/derecho')}. ${tt('En naranja, infusiones.')}</p></div>`:''}`}
function mhLots(A){const m={};A.forEach(x=>{const d=x[0],l=(d.lot||'').trim();if(!l)return;if(!m[l])m[l]={l,p:d.product,u:0,f:d,z:d};const o=m[l];o.u++;o.z=d;if(!o.p&&d.product)o.p=d.product});
const L=Object.values(m);
return `<div><h4>${tt('Lotes')}</h4><p class="hint">${tt('Cada lote con el fármaco y sus fechas de uso.')}</p></div><div class="mh-tw"><table><thead><tr><th>${tt('Lote')}</th><th>${tt('Fármaco')}</th><th>${tt('Usos')}</th><th>${tt('Primer uso')}</th><th>${tt('Último uso')}</th></tr></thead><tbody>${L.length?L.map(o=>`<tr><td class="m">${esc(o.l)}</td><td>${esc(o.p||'—')}</td><td>${o.u}</td><td>${mhDY(o.f)}</td><td>${mhDY(o.z)}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">${tt('Sin lotes anotados todavía.')}</td></tr>`}</tbody></table></div>`}
const mhView=()=>M.map((d,i)=>[d,i]).filter(x=>(!MHF.site||medSite(x[0])==MHF.site)&&(!MHF.lot||(x[0].lot||'').trim()==MHF.lot)).sort((a,b)=>(b[0].date+b[0].time).localeCompare(a[0].date+a[0].time));
function mhRegBody(){const V=mhView();
return `<div class="mh-tw maxh"><table><thead><tr><th>${tt('Fecha')}</th><th>${tt('Tipo')}</th><th>${tt('Fármaco')}</th><th>${tt('Dosis')}</th><th>${tt('Lote')}</th><th>${tt('Punto')}</th></tr></thead><tbody>${V.length?V.map(x=>{const d=x[0];return `<tr data-a="medopen" data-i="${x[1]}"><td>${mhDY(d)}${d.notes?' <span class="dot" title="'+esc(d.notes)+'">●</span>':''}</td><td><span class="kind"><i style="background:${MHC[d.kind]||'var(--s1)'}"></i>${esc(d.kind)}</span></td><td>${esc(d.product||'—')}</td><td>${d.dose?esc(d.dose+' '+d.unit):'—'}</td><td class="m">${esc(d.lot||'—')}</td><td>${esc(medSite(d))}</td></tr>`}).join(''):`<tr><td colspan="6" class="empty">${M.length?tt('No hay dosis que coincidan.'):tt('Todavía no hay dosis registradas.')}</td></tr>`}</tbody></table></div>`}
function mhReg(){const sites=[...new Set(M.map(medSite))].sort(),lots=[...new Set(M.map(d=>(d.lot||'').trim()).filter(Boolean))].sort();const V=mhView(),obs=M.filter(d=>d.notes);
return `<div class="mh-head"><div><h4>${tt('Registro por dosis')} <span id="mhcnt" style="color:var(--m);font-weight:500">· ${V.length} ${tt('de')} ${M.length}</span></h4><p class="hint">${tt('Toca una fila para editarla. Los filtros también se aplican a la exportación.')}</p></div><button class="mh-btn" data-a="expmedf">${tt('Exportar CSV')}</button></div>
<div class="mh-msg" id="msg" role="status" aria-live="polite"></div>
<div class="mh-flt"><label>${tt('Punto')}<select data-mf="site"><option value="">${tt('Todos')}</option>${sites.map(s=>`<option${MHF.site==s?' selected':''}>${esc(s)}</option>`).join('')}</select></label><label>${tt('Lote')}<select data-mf="lot"><option value="">${tt('Todos')}</option>${lots.map(s=>`<option${MHF.lot==s?' selected':''}>${esc(s)}</option>`).join('')}</select></label></div>
<div id="mhreg">${mhRegBody()}</div>${obs.length?`<div class="mh-note"><b>${tt('Notas')} (●):</b> ${obs.slice(0,10).map(d=>mhDY(d)+' ('+esc(d.notes)+')').join('; ')}${obs.length>10?'…':''}</div>`:''}`}
function medDash(){const A=mhAsc();
return `<div class="mh">${mhKpis(A)}<section class="mh-card" id="mhch">${mhChart(A)}</section><section class="mh-card">${mhSites(A)}</section><section class="mh-card">${mhLots(A)}</section><section class="mh-card">${mhReg()}</section></div>`}
function mhRefresh(id,html){const el=document.getElementById(id);if(el){el.innerHTML=html;tr(el)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mu],rect.mbar');if(!b)return;
if(b.dataset.mu){MHU=b.dataset.mu;MHSEL=null;mhRefresh('mhch',mhChart(mhAsc()));const sc=document.getElementById('mhsc');if(sc)sc.scrollLeft=sc.scrollWidth;return}
const i=+b.dataset.mi;MHSEL=MHSEL===i?null:i;document.querySelectorAll('.mh rect.mbar').forEach(r=>r.classList.toggle('sel',+r.dataset.mi===MHSEL));mhRefresh('mhdet',mhDet())});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.mf)return;MHF[t.dataset.mf]=t.value;mhRefresh('mhreg',mhRegBody());const c=document.getElementById('mhcnt');if(c)c.textContent='· '+mhView().length+' '+tt('de')+' '+M.length});
new MutationObserver(()=>{const sc=document.getElementById('mhsc');if(sc&&!sc.dataset.s){sc.dataset.s=1;sc.scrollLeft=sc.scrollWidth}}).observe(document.getElementById('app'),{childList:true});
Object.entries({'profilaxis':'prophylaxis','infusión':'infusion','Dosis registradas':'Doses logged','Periodo':'Period','Primera y última anotada':'First and last logged','Intervalo de profilaxis':'Prophylaxis interval','días':'days','Sin datos':'No data','Hace falta más de una dosis':'Needs more than one dose','Entre dosis de profilaxis':'Between prophylaxis doses','Siguiente profilaxis':'Next prophylaxis','Si se mantiene el ritmo':'If the pace holds','Dosis por administración':'Dose per administration','Toca una barra para ver el detalle.':'Tap a bar to see details.','dosis sin cantidad o en otra unidad no aparecen en el gráfico.':'doses without an amount or in another unit are not charted.','lote':'lot','Puntos de administración':'Administration sites','Número de veces por zona.':'Times per site.','Rotación en orden de fecha':'Rotation by date','abdomen':'abdomen','muslo izquierdo/derecho':'left/right thigh','brazo izquierdo/derecho':'left/right arm','En naranja, infusiones.':'Orange: infusions.','Lotes':'Lots','Cada lote con el fármaco y sus fechas de uso.':'Each lot with its drug and dates of use.','Usos':'Uses','Primer uso':'First use','Último uso':'Last use','Sin lotes anotados todavía.':'No lots logged yet.','Tipo':'Type','Punto':'Site','No hay dosis que coincidan.':'No matching doses.','Registro por dosis':'Dose log','de':'of','Toca una fila para editarla. Los filtros también se aplican a la exportación.':'Tap a row to edit it. Filters also apply to the export.','Exportar CSV':'Export CSV','Todos':'All','Fármaco':'Drug','Fecha':'Date','Lote':'Lot','Dosis':'Dose','Notas':'Notes','Profilaxis':'Prophylaxis','Infusión':'Infusion'}).forEach(([k,v])=>{if(!(k in D))D[k]=v});
function med(){return hd('Medicación')+`<div class="seg"><button class="${S.medView!='dash'?'on':''}" data-a="medv" data-v="list">${tt('Registro')}</button><button class="${S.medView=='dash'?'on':''}" data-a="medv" data-v="dash">${tt('Historial')}</button></div>${S.medView=='dash'?medDash():medList()}`}
function medForm(){const d=S.md;
return hd(tt('Registro de medicación'),1)+`<h3>${tt('Tipo de medicación')}</h3><div class="row">${chip('mkind','Profilaxis',d.kind,'💉 '+tt('Profilaxis'))}${chip('mkind','Infusión',d.kind,'🩸 '+tt('Infusión'))}</div>
${d.kind=='Profilaxis'?`<h3>${tt('¿Dónde se ha colocado?')}</h3><p class="note">${tt('Rota el punto de inyección en cada dosis: abdomen, muslo o brazo.')}</p><div class="row">${PLOC.map(z=>chip('mploc',z,d.ploc)).join('')}</div>${d.ploc!='Abdomen'?`<label>${tt('Lado')}</label><div class="row">${chip('mside','I',d.side,tt('Izquierdo'))}${chip('mside','D',d.side,tt('Derecho'))}</div>`:''}`
:`<h3>${tt('¿En qué brazo?')}</h3><div class="row">${chip('marm','I',d.arm,tt('Izquierdo'))}${chip('marm','D',d.arm,tt('Derecho'))}</div>`}
<label>${tt('Fecha')}</label><input type="date" data-m="date" value="${d.date}"><label>${tt('Hora')}</label><input type="time" data-m="time" value="${d.time}">
<label>${tt('Nombre del fármaco')}</label><input type="text" data-m="product" value="${esc(d.product)}" placeholder="${tt('Ej. nombre comercial')}"><label>${tt('Lote')}</label><input type="text" data-m="lot" value="${esc(d.lot)}" placeholder="${tt('Ej. número de lote')}"><div class="row"><div><label>${tt('Dosis')}</label><input type="number" data-m="dose" value="${esc(d.dose)}"></div><div><label>${tt('Unidad')}</label><select data-m="unit"><option${d.unit=='UI'?' selected':''}>UI</option><option${d.unit=='mg'?' selected':''}>mg</option><option${d.unit=='ml'?' selected':''}>ml</option></select></div></div>
<label>${tt('Notas')}</label><textarea rows="2" data-m="notes" placeholder="${tt('En caso de reacción u otro síntoma, indícalo aquí')}">${esc(d.notes)}</textarea>
<button class="btn" data-a="mdsave">${tt('Guardar')}</button>`}
function navUser(){const u=(CURRENT_USER||(P.name||'').trim().split(/\s+/)[0]||'').trim();if(!u)return 'Perfil';return esc(u.length>8?u.slice(0,7)+'…':u)}
function R(){let h;
if(AUTH_LOADING){document.getElementById('app').innerHTML=loadingScreen();tr(document.getElementById('app'));document.documentElement.lang=LANG;return;}
if(!AUTHED){document.getElementById('app').innerHTML=authScreen();tr(document.getElementById('app'));document.documentElement.lang=LANG;window.scrollTo(0,0);return;}
if(S.scr=='quick')h=quick();else if(S.scr=='wiz')h=wiz();else if(S.scr=='sumd')h=summary(S.d,0);else if(S.scr=='priv')h=priv();else if(S.scr=='view')h=summary(E[S.edit],1);
else if(S.scr=='sosedit')h=sosEdit();else if(S.scr=='medform')h=medForm();else if(S.scr=='userinfo')h=userScreen();else if(S.scr=='config')h=sett();else if(S.scr=='util')h=utilScreen();else h={home,segui,sett:settMenu,sos,med}[S.tab]?{home,segui,sett:settMenu,sos,med}[S.tab]():home();
const nav=[['home',ic('home'),'Inicio'],['segui',ic('act'),'Actividad'],['sos',ic('sos'),'SOS'],['sett',ic('user'),navUser()]];
document.getElementById('app').innerHTML=h+`<nav><div>${(()=>{const b=nav.map(n=>{
  return `<button class="${n[0]=='sos'?'sosb':''} ${!S.scr&&S.tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`;
});b.splice(2,0,`<button class="fab" data-a="new" aria-label="Registrar sangrado">${S.tab=='home'&&!S.scr?'<span class="fabhint"><b>Registro rápido</b><span class="chevs"><i>⌄</i><i>⌄</i></span></span>':''}<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>`);return b.join('')})()}</div></nav>`;tr(document.getElementById('app'));document.documentElement.lang=LANG;window.scrollTo(0,0)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,k=el.dataset.k,v=el.dataset.v,d=S.d;
if(a!='del'&&a!='clr')S.del=false;
if(a=='navgo'){if(v=='config'){S.scr='config'}else if(v=='user'){S.scr='userinfo'}else{S.scr='priv'}R();return}
if(a=='utilgo'){S.scr='util';R();return}
if(a=='authmode'){AU.mode=v;AUTH_ERR='';R();return}
if(a=='authsubmit'){authSubmit();return}
if(a=='logout'){authLogout();return}
if(a=='sosedit'){S.pd=Object.assign({},P);S.scr='sosedit'}
else if(a=='psave'){P=S.pd;try{localStorage.setItem('hmp',JSON.stringify(P))}catch(x){}cloudUpSos(P);S.scr='sos'}
else if(a=='tab'){S.tab=v;S.scr=null}
else if(a=='trk'){S.trackView=v}
else if(a=='medv'){S.medView=v}
else if(a=='mdnew'){S.md=newMD();S.medEdit=null;S.scr='medform'}
else if(k=='mkind'){S.md.kind=v}
else if(k=='mploc'){S.md.ploc=v}
else if(k=='mside'){S.md.side=v}
else if(k=='marm'){S.md.arm=v}
else if(a=='mdsave'){if(S.medEdit!=null)M[S.medEdit]=S.md;else M.unshift(S.md);saveM();cloudUpMed(S.md);S.scr=null;S.tab='med'}
else if(a=='medopen'){S.medEdit=+el.dataset.i;S.md=JSON.parse(JSON.stringify(M[S.medEdit]));S.scr='medform'}
else if(a=='set'){if(k=='flt')S.flt=v;else{d[k]=v;if(k=='type'){d.loc='';d.side=''}}}
else if(a=='tog'){const i=d[k].indexOf(v);i<0?d[k].push(v):d[k].splice(i,1)}
else if(a=='new'){S.d=newD();S.edit=null;S.scr='quick'}
else if(a=='newwiz'){S.d=newD();S.edit=null;S.step=0;S.scr='wiz'}
else if(a=='full'){S.step=0;S.scr='wiz'}
else if(a=='saveq'){S.d.status='Activo';E.unshift(S.d);save();cloudUpEp(S.d);S.scr=null;S.tab='home'}
else if(a=='next'){if(S.step<5)S.step++;else S.scr='sumd'}
else if(a=='back'){if(S.scr=='wiz'&&S.step>0)S.step--;else if(S.scr=='sumd'){S.scr='wiz';S.step=5}else S.scr=null}
else if(a=='addx'){d.extra.push({dose:'',time:now().time})}
else if(a=='save'){if(S.edit!=null)E[S.edit]=S.d;else E.unshift(S.d);save();cloudUpEp(S.d);S.scr=null;S.tab='segui'}
else if(a=='editd'){S.scr='wiz';S.step=0}
else if(a=='open'){S.edit=+el.dataset.i;S.scr='view'}
else if(a=='edit'){S.d=JSON.parse(JSON.stringify(E[S.edit]));S.step=0;S.scr='wiz'}
else if(a=='stat'){E[S.edit].status=v;save();cloudUpEp(E[S.edit])}
else if(a=='del'){if(S.del){const rm=E.splice(S.edit,1)[0];save();cloudDelEp(rm&&rm.id);S.scr=null;S.del=false}else S.del=true}
else if(a=='clr'){if(S.del){E=[];save();S.del=false}else S.del=true}
else if(a=='priv'){S.scr='priv'}
else if(a=='lang'){LANG=v;try{localStorage.setItem('hml',v)}catch(x){}}
else if(a=='exp'){exportCsv();return}
else if(a=='expf'){exportCsv(shView().map(x=>x[0]));return}
else if(a=='expmed'){exportMedCsv();return}
else if(a=='expmedf'){exportMedCsv(mhView().map(x=>x[0]));return}
R()});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('langsel')){LANG=t.value;try{localStorage.setItem('hml',LANG)}catch(x){}R()}});
document.addEventListener('input',e=>{const t=e.target,d=S.d;
if(t.dataset.m){S.md[t.dataset.m]=t.value;return}
if(t.dataset.au){AU[t.dataset.au]=t.value;return}
if(t.dataset.p){S.pd[t.dataset.p]=t.value;return}
if(t.dataset.x){const[i,f]=t.dataset.x.split('.');d.extra[i][f]=t.value;return}
const k=t.dataset.k;if(!k)return;
if(t.type=='range'){d[k]=+t.value;const o=document.getElementById('o_'+k);if(o)o.textContent=t.value+'/10';return}
d[k]=t.value;if(k=='type'){d.loc='';d.side='';R()}});
R();
authInit();
